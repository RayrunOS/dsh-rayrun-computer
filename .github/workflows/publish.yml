# Publishes dsh-rayrun-computer to npm from a GitHub Release.
#
# One-time setup on npmjs.com — package → Settings → Trusted publishing:
#   organization: RayrunOS
#   repository:   dsh-rayrun-computer
#   workflow:     publish.yml
#   environment:  (leave empty)
# Then no NPM_TOKEN exists anywhere: the npm CLI exchanges the GitHub OIDC
# token for a short-lived publish token and attaches provenance by itself.
#
# The very first publish is the exception: npm only exposes trusted-publisher
# settings for a package that already exists, so 1.0.0 uses a repository
# secret. Create a granular npm token with read/write access to all packages
# and 2FA bypass enabled, save it as NPM_TOKEN, publish the GitHub Release,
# then add the trusted publisher above and delete the secret. While NPM_TOKEN
# exists it takes precedence over OIDC.
#
# Release flow: bump "version" in package.json on main, tag vX.Y.Z on that
# commit, publish a GitHub Release for the tag. A tag that does not match
# package.json stops the job before it touches the registry.
#
# A manual run (workflow_dispatch) is a dry run: checks and `npm pack` only.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; no long-lived npm token
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # main's history is needed for the ancestry check

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24' # ships npm >= 11.5.1, required for trusted publishing
          registry-url: 'https://registry.npmjs.org'

      - name: Read the package version
        run: echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      - name: Check the tag against package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; release only from main"
            exit 1
          fi

      - name: Run the offline checks
        run: |
          for file in index.js client.js lib/auth.js lib/rayrun.js; do
            node --check "$file"
          done
          node test/locale-audit.mjs

      - name: Inspect the tarball
        env:
          PACK_JSON: ${{ runner.temp }}/pack.json
        run: |
          npm pack --dry-run --json > "$PACK_JSON"
          node -e '
          const { readFileSync } = require("node:fs")
          // npm keys the report by package name in newer versions; older ones print an array.
          const parsed = JSON.parse(readFileSync(process.env.PACK_JSON, "utf8"))
          const pack = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0]
          const files = new Set(pack.files.map((entry) => entry.path))
          const required = [
            "package.json", "index.js", "client.js", "cordis.patch.yml",
            "icon.png", "lib/update.js", "locale/en.json", "locale/zh.json",
          ]
          const missing = required.filter((path) => !files.has(path))
          if (missing.length) {
            console.error(`tarball is missing: ${missing.join(", ")}`)
            process.exit(1)
          }
          console.log(`${pack.filename}: ${files.size} files`)
          '

      - name: Refuse to republish an existing version
        run: |
          if npm view "dsh-rayrun-computer@$VERSION" version > /dev/null 2>&1; then
            echo "::error::dsh-rayrun-computer@$VERSION is already on the registry"
            exit 1
          fi

      - name: Report the dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "dry run: dsh-rayrun-computer@$VERSION was not published" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: github.event_name == 'release'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # bootstrap only; delete once OIDC works
        run: npm publish --provenance --access public

      - name: Verify the release
        if: github.event_name == 'release'
        run: |
          for attempt in 1 2 3 4 5; do
            if npm view "dsh-rayrun-computer@$VERSION" version > /dev/null 2>&1; then
              echo "published dsh-rayrun-computer@$VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::npm does not serve dsh-rayrun-computer@$VERSION yet"
          exit 1
